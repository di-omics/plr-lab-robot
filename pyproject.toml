[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plr-lr"
version = "0.1.0"
description = "Bring a robotic arm under PyLabRobot control, then give it eyes, hands, and the judgment to decline: simulation-first arm onboarding, eye-in-hand computer vision, dexterous manipulation, and a world model that is scored on when it refuses to predict."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "di-omics" }]
keywords = [
  "lab-automation",
  "pylabrobot",
  "robotic-arm",
  "computer-vision",
  "hand-eye-calibration",
  "manipulation",
  "robotics",
  "world-model",
  "robot-learning",
  "selective-prediction",
  "abstention",
  "benchmark",
  "model-predictive-control",
]
dependencies = [
  "pylabrobot>=0.2",
  "numpy>=1.23",
]

[project.optional-dependencies]
# Real SOTA detectors (RF-DETR / SAM2) plug into the Detector seam. Left optional
# so the simulation path stays CPU-only and dependency-light.
vision = [
  "opencv-python-headless>=4.8",
]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["plr_lr*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep the enforced set explicit. Ruff's larger rule families include modern
# annotation rewrites that conflict with this project's Python 3.9 floor.
select = ["E4", "E7", "E9", "F"]
