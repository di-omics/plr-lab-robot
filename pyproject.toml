[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plr-lr"
version = "0.2.0"
description = "Simulation-first lab robotics: PyLabRobot arm control, eye-in-hand vision, dexterous skills, and auditable workcell task contracts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "di-omics" }]
keywords = [
  "lab-automation",
  "pylabrobot",
  "robotic-arm",
  "computer-vision",
  "hand-eye-calibration",
  "manipulation",
  "robotics",
  "workcell",
  "provenance",
]
dependencies = [
  "pylabrobot>=0.2",
  "numpy>=1.23",
]

[project.optional-dependencies]
# Real SOTA detectors (RF-DETR / SAM2) plug into the Detector seam. Left optional
# so the simulation path stays CPU-only and dependency-light.
vision = [
  "opencv-python-headless>=4.8",
]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["plr_lr*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
